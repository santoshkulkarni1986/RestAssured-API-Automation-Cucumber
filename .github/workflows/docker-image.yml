name: Maven Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Set up JDK 11
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    # 3️⃣ Cache Maven dependencies
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # 4️⃣ Build and test Maven project
    - name: Build and test with Maven
      run: mvn clean install

    # 5️⃣ Upload ExtentReports and CustomListener outputs as artifacts
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      with:
        name: TestReports
        path: target/   # Ensure your reports are generated under target/

    # 6️⃣ Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 7️⃣ Build Docker image (only if tests pass)
    - name: Build Docker image
      run: |
        IMAGE_NAME=my-maven-app
        TAG=${{ github.sha }}
        docker build . -f Dockerfile -t $IMAGE_NAME:$TAG
        echo "Docker image $IMAGE_NAME:$TAG built successfully"

    # 8️⃣ Optional: Push Docker image to Docker Hub
    # - name: Log in to Docker Hub
    #   uses: docker/login-action@v2
    #   with:
    #     username: ${{ secrets.DOCKER_USERNAME }}
    #     password: ${{ secrets.DOCKER_PASSWORD }}
