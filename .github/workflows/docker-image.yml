name: Maven Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Set up JDK 11
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    # 3️⃣ Cache Maven dependencies
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # 4️⃣ Build and test Maven project
    - name: Build and test with Maven
      run: mvn clean install

    # 5️⃣ Upload ExtentReports and CustomListener outputs as artifacts
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      with:
        name: TestReports
        path: target/   # Ensure your reports are generated under target/


   
